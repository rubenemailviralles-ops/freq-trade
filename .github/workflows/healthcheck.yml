name: Freqtrade Healthcheck

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping UI version
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "SSH_HOST not set; skipping public healthcheck."
            exit 0
          fi
          curl -sSf "http://${{ secrets.SSH_HOST }}:8080/ui_version" || exit 1
